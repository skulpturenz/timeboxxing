name: App Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: App build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    env:
      CGO_ENABLED: "1"
      GO_BINARY: go

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: sidecar/go.sum

      - name: Add MSYS2 MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Show C compiler
        if: runner.os == 'Windows'
        run: gcc --version

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble app
        if: runner.os != 'Windows'
        working-directory: app
        run: ./gradlew --no-daemon assemble

      - name: Assemble app
        if: runner.os == 'Windows'
        working-directory: app
        run: .\gradlew.bat --no-daemon assemble
