name: Installer Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Installer build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    env:
      CGO_ENABLED: "1"
      GO_BINARY: go

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: |
            sidecar/go.sum
            sidecar/third_party/go-sqlite3/PROVENANCE.md

      - name: Add MSYS2 MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Show C compiler
        if: runner.os == 'Windows'
        run: gcc --version

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve CI build version
        shell: bash
        run: |
          # CI commits have no release tag, so stamp a dev version traceable to the commit.
          # appVersion is the string shown in-app (and drives the updater's version comparison).
          # packageVersion "0.0.0-0" normalizes to the floor installer version 1.0.0, so ANY published
          # release outranks a CI build and can upgrade over it on Windows (MSI blocks downgrades).
          echo "APP_VERSION=0.0.0+${GITHUB_SHA::7}" >> "${GITHUB_ENV}"
          echo "PACKAGE_VERSION=0.0.0-0" >> "${GITHUB_ENV}"
          echo "JAVA_ENV=development" >> "${GITHUB_ENV}"

      - name: Package macOS installer
        if: runner.os == 'macOS'
        working-directory: app
        run: ./gradlew --no-daemon -p ../installer :packager:packageDmg -Ptimeboxxing.javaEnv="${JAVA_ENV}" -Ptimeboxxing.packageVersion="${PACKAGE_VERSION}" -Ptimeboxxing.appVersion="${APP_VERSION}"

      - name: Package Windows installer
        if: runner.os == 'Windows'
        working-directory: app
        # packageExe = the first-time installer; packageWindowsAppImageZip = the app-image zip the
        # in-app updater downloads and swaps over the install directory.
        run: .\gradlew.bat --no-daemon -p ..\installer :packager:packageExe :packager:packageWindowsAppImageZip "-Ptimeboxxing.javaEnv=$env:JAVA_ENV" "-Ptimeboxxing.packageVersion=$env:PACKAGE_VERSION" "-Ptimeboxxing.appVersion=$env:APP_VERSION"

      - name: Dump packaging logs on failure
        if: failure()
        shell: bash
        run: |
          echo "== Compose/jpackage logs =="
          find installer/packager/build/compose/logs -type f -print -exec cat {} \; 2>/dev/null || true

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos
          path: installer/packager/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: |
            installer/packager/build/compose/binaries/main/exe/*.exe
            installer/packager/build/compose/binaries/main/app-image/*.zip
          if-no-files-found: error
          retention-days: 14
