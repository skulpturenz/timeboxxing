version: "2"
sql:
  - engine: sqlite
    schema: schema
    queries: read_queries
    gen:
      go:
        package: readqueries
        out: read_queries
        emit_interface: true
        omit_unused_structs: true
        emit_pointers_for_null_types: true
  - engine: sqlite
    schema: schema
    queries: write_queries
    gen:
      go:
        package: writequeries
        out: write_queries
        emit_interface: true
        omit_unused_structs: true
        emit_pointers_for_null_types: true
