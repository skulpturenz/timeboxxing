version: "2"
sql:
  - engine: sqlite
    schema: sqlite/schema
    queries: sqlite/queries
    gen:
      go:
        package: queries
        out: queries
        emit_interface: true
        overrides:
          - column: transition_event_metadata.tab
            go_type:
              type: string
              pointer: true
          - column: transition_event_metadata.cdp_url
            go_type:
              type: string
              pointer: true
