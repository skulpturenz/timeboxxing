syntax = "proto3";

package settings.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/skulpturenz/timeboxxing/sidecar/gen/settings/v1;settingsv1";
option java_multiple_files = true;
option java_package = "com.timeboxxing.sidecar.settings.v1";

service SettingsService {
  rpc ListModelOptions(ListModelOptionsRequest) returns (ListModelOptionsResponse);
  rpc GetAiSettings(GetAiSettingsRequest) returns (AiSettings);
  rpc SaveAiSettings(SaveAiSettingsRequest) returns (AiSettings);
  rpc GetDatabaseMaintenanceStatus(GetDatabaseMaintenanceStatusRequest) returns (DatabaseMaintenanceStatus);
  rpc PruneDatabaseRange(PruneDatabaseRangeRequest) returns (PruneDatabaseRangeResponse);
  rpc VacuumDatabase(VacuumDatabaseRequest) returns (VacuumDatabaseResponse);
}

message ListModelOptionsRequest {}

message ListModelOptionsResponse {
  repeated ModelOption models = 1;
}

message ModelOption {
  int64 id = 1;
  string openrouter_slug = 2;
  string ollama_slug = 3;
  string label = 4;
  bool semantic = 5;
  bool embedding = 6;
}

message GetAiSettingsRequest {
  bool openrouter_secret_exists = 1;
  bool ollama_secret_exists = 2;
}

message SaveAiSettingsRequest {
  AiProvider provider = 1;
  string model_provider_base_url = 2;
  int64 embedding_model_id = 4;
  int64 semantic_model_id = 5;
  bool openrouter_secret_exists = 6;
  bool ollama_secret_exists = 7;
}

message AiSettings {
  AiProvider provider = 1;
  string model_provider_base_url = 2;
  int64 embedding_model_id = 4;
  int64 semantic_model_id = 5;
  bool openrouter_secret_exists = 6;
  bool ollama_secret_exists = 7;
}

message GetDatabaseMaintenanceStatusRequest {}

message DatabaseMaintenanceStatus {
  int64 size_bytes = 1;
}

message PruneDatabaseRangeRequest {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp ended_at = 2;
}

message PruneDatabaseRangeResponse {
  int64 size_bytes = 1;
  int64 ledger_items_deleted = 2;
  int64 ledger_item_timeline_entries_deleted = 3;
  int64 timeline_deleted = 4;
  int64 foreground_processes_deleted = 5;
  int64 foreground_process_metadata_deleted = 6;
  int64 timeline_semantic_documents_deleted = 7;
  int64 timeline_embeddings_deleted = 8;
  int64 applications_deleted = 9;
}

message VacuumDatabaseRequest {}

message VacuumDatabaseResponse {
  int64 size_before_bytes = 1;
  int64 size_after_bytes = 2;
}

enum AiProvider {
  AI_PROVIDER_UNSPECIFIED = 0;
  OPENROUTER = 1;
  OLLAMA = 2;
}
