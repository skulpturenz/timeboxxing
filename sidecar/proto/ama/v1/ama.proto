syntax = "proto3";

package ama.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/skulpturenz/timeboxxing/sidecar/gen/ama/v1;amav1";
option java_multiple_files = true;
option java_package = "com.timeboxxing.sidecar.ama.v1";

service AmaService {
  rpc Ask(AskRequest) returns (AskResponse);
  rpc GetSemanticIndexStatus(GetSemanticIndexStatusRequest) returns (SemanticIndexStatus);
}

message AskRequest {
  string question = 1;
  int32 max_sources = 2;
  StructuredQuery structured_query = 3;
}

message AskResponse {
  string answer = 1;
  string model = 2;
  repeated Source sources = 3;
  SemanticIndexStatus semantic_index_status = 4;
  repeated Artifact artifacts = 5;
}

message Source {
  int64 transition_event_id = 1;
  string content = 2;
  double distance = 3;
  string document_key = 4;
  string document_type = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
}

message Artifact {
  // 1, 3 and 4 were the app usage chart, habit summary and window comparison, removed with the
  // assistants that produced them
  reserved 1, 3, 4;

  oneof value {
    UsageTimeline usage_timeline = 2;
  }
}

enum QueryKind {
  // 1, 3 and 4 were APP_TOTALS, HABITS and COMPARE_PERIODS
  reserved 1, 3, 4;

  QUERY_KIND_UNSPECIFIED = 0;
  QUERY_KIND_TIMELINE = 2;
}

message StructuredQuery {
  // 3 and 7 were the baseline window and its label, only ever used by the window comparison
  reserved 3, 7;

  QueryKind kind = 1;
  TimeWindow window = 2;
  int32 limit = 4;
  bool include_idle = 5;
  string period_label = 6;
}

message TimeWindow {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp ended_at = 2;
}

message UsageTimeline {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp ended_at = 2;
  string timezone = 3;
  int64 total_duration_seconds = 4;
  repeated UsageTimelineEvent events = 5;
  string period_label = 6;
  int32 total_event_count = 7;
  bool truncated = 8;
}

message UsageTimelineEvent {
  int64 transition_event_id = 1;
  string title = 2;
  string source_name = 3;
  string source_type = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp ended_at = 6;
  int64 duration_seconds = 7;
  string application_identifier = 8;
  string application_path = 9;
  string url_host = 10;
  bool idle = 11;
}

message GetSemanticIndexStatusRequest {}

message SemanticIndexStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    READY = 1;
    INDEXING = 2;
    EMPTY = 3;
    UNAVAILABLE = 4;
  }

  State state = 1;
  int64 completed_event_count = 2;
  int64 indexed_event_count = 3;
  int64 pending_event_count = 4;
  bool backfill_running = 5;
  string message = 6;
}
